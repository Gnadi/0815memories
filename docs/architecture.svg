<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Kaydo's architecture</title>
  <desc id="d">The browser encrypts, reads and writes Firestore directly through firestore.rules, and uploads encrypted files to Cloudinary. Cloud Functions come in three kinds: commands the app calls, reactions to document writes, and scheduled reconcilers. They write to Firestore and reach Firebase Auth, Cloud Messaging, Peecho, Cloudinary and Storage.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b4252"/></marker>
  </defs>
  <rect width="960" height="600" rx="10" fill="#f7f8fb"/>
  <g fill="#ffffff" stroke="#3b4252" stroke-width="1.4">
    <rect x="40" y="24" width="880" height="64" rx="6"/>
    <rect x="40" y="160" width="220" height="400" rx="6"/>
    <rect x="370" y="160" width="260" height="110" rx="6"/>
    <rect x="370" y="300" width="260" height="110" rx="6"/>
    <rect x="370" y="440" width="260" height="120" rx="6"/>
    <rect x="740" y="160" width="140" height="110" rx="6"/>
    <rect x="740" y="300" width="140" height="110" rx="6"/>
    <rect x="740" y="440" width="180" height="120" rx="6"/>
  </g>
  <rect x="40" y="160" width="220" height="46" rx="6" fill="#e6ebf7" stroke="#3b4252" stroke-width="1.4"/>
  <g fill="none" stroke="#3b4252" stroke-width="1.4">
    <line x1="150" y1="88" x2="150" y2="158" marker-end="url(#a)"/>
    <line x1="500" y1="88" x2="500" y2="158" marker-end="url(#a)"/>
    <line x1="900" y1="88" x2="900" y2="438" marker-end="url(#a)"/>
    <line x1="370" y1="215" x2="262" y2="215" marker-end="url(#a)"/>
    <line x1="630" y1="215" x2="738" y2="215" marker-end="url(#a)"/>
    <line x1="260" y1="335" x2="368" y2="335" marker-end="url(#a)"/>
    <line x1="370" y1="380" x2="262" y2="380" marker-end="url(#a)"/>
    <line x1="630" y1="355" x2="738" y2="355" marker-end="url(#a)"/>
    <line x1="370" y1="500" x2="262" y2="500" marker-end="url(#a)" marker-start="url(#a)"/>
    <line x1="630" y1="500" x2="738" y2="500" marker-end="url(#a)"/>
  </g>
  <g fill="#1b2230" font-size="13" text-anchor="middle">
    <text x="480" y="51" font-size="15" font-weight="600">Browser</text>
    <text x="480" y="72">pages and hooks · services encrypt with the family key</text>

    <text x="150" y="188" font-size="13" font-weight="600">firestore.rules decide</text>
    <text x="150" y="350" font-size="15" font-weight="600">Firestore</text>
    <text x="150" y="372">family content as ciphertext</text>
    <text x="150" y="391">who belongs to a family</text>
    <text x="150" y="410">the media ledger</text>

    <text x="500" y="186" font-size="15" font-weight="600">Commands</text>
    <text x="500" y="207">called by the app</text>
    <text x="500" y="230" font-size="12">viewer login, upload signature,</text>
    <text x="500" y="247" font-size="12">invites and admins, family deletion</text>

    <text x="500" y="326" font-size="15" font-weight="600">Reactions</text>
    <text x="500" y="347">triggers, retried</text>
    <text x="500" y="370" font-size="12">admin claims, login-page mirror,</text>
    <text x="500" y="387" font-size="12">media ledger, push</text>

    <text x="500" y="466" font-size="15" font-weight="600">Reconcilers</text>
    <text x="500" y="487">scheduled</text>
    <text x="500" y="510" font-size="12">unused media, print files,</text>
    <text x="500" y="527" font-size="12">family deletion, reminders</text>

    <text x="810" y="211" font-size="15" font-weight="600">Peecho</text>
    <text x="810" y="231" font-size="12">printed books</text>
    <text x="810" y="345" font-size="15" font-weight="600">Auth · FCM</text>
    <text x="810" y="365" font-size="12">roles, push</text>
    <text x="830" y="490" font-size="15" font-weight="600">Cloudinary</text>
    <text x="830" y="510" font-size="12">encrypted files</text>
    <text x="830" y="530" font-size="12">Storage: print files</text>
  </g>
  <g fill="#1b2230" font-size="12">
    <text x="158" y="120">reads and writes</text>
    <text x="158" y="136">directly</text>
    <text x="508" y="128">calls</text>
    <text x="892" y="120" text-anchor="end">uploads with a signature</text>
    <text x="315" y="207" text-anchor="middle">transactions</text>
    <text x="685" y="207" text-anchor="middle">checkout</text>
    <text x="315" y="327" text-anchor="middle">document written</text>
    <text x="315" y="398" text-anchor="middle">ledger, mirror</text>
    <text x="685" y="347" text-anchor="middle">claims, push</text>
    <text x="315" y="492" text-anchor="middle">checks, tidies</text>
    <text x="685" y="492" text-anchor="middle">deletes files</text>
  </g>
  <text x="630" y="150" fill="#5b6577" font-size="12" text-anchor="end">Cloud Functions</text>
</svg>
