name: Firestore Rules & Indexes

# The rules tests run on every pull request and every push to main. They
# also cover the queries the client makes — a query the rules no longer allow
# fails there — and those queries live all over src/, so no list of paths can
# say when they are safe to skip. They take about a minute.
#
# The deploy to Firebase runs on main only, and only when something it
# deploys changed (or when started by hand).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two merges in quick succession deploy one after the other, never in parallel.
# On a pull request a new push replaces the run for the previous one.
concurrency:
  group: firestore-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The Firestore emulator the rules tests run against needs Java.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: firestore.indexes.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"

      # Loads firestore.rules into the emulator, so rules that do not compile —
      # or no longer do what the tests expect — never reach the project.
      - name: Test the rules against the emulator
        run: npm run test:rules

  changes:
    name: Deployable files changed?
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # A push compares against the commit main pointed to before it. A run
      # started by hand, or a push whose previous commit is unknown, deploys.
      - name: Compare with the previous main
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            firestore.rules firestore.indexes.json firebase.json .github/workflows/firebase-firestore.yml)
          if [ -n "$changed" ]; then
            printf 'Changed:\n%s\n' "$changed"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to deploy: rules, indexes and firebase.json are unchanged."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Firebase
    needs: [validate, changes]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the deploy configuration
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          missing=0
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set (Settings → Secrets and variables → Actions)."
            missing=1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::error::Variable FIREBASE_PROJECT_ID is not set (Settings → Secrets and variables → Actions → Variables)."
            missing=1
          fi
          exit "$missing"

      # firebase-tools is a devDependency, so the deploy uses the pinned version.
      - run: npm ci

      - name: Write the service-account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-service-account.json','utf8'))" \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON."; exit 1; }

      # --project overrides the demo project from .firebaserc (demo-kaydo).
      # No --force: indexes that exist in Firebase but are missing from
      # firestore.indexes.json are only reported, never deleted.
      - name: Deploy rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx firebase-tools deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
