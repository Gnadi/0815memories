<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are owned
         per-route by react-helmet-async (vite-react-ssg <Head>) — see
         src/pages/LandingPage.jsx — so they are NOT duplicated here. The
         pre-rendered "/" HTML carries the full landing-page metadata; for
         client-only routes the same prerendered shell is served as SPA fallback. -->
    <meta name="author" content="Kaydo" />
    <meta name="keywords" content="family memories, private photo sharing, encrypted family app, family journal, recipe keeper, digital scrapbook" />

    <!-- PWA / App -->
    <meta name="theme-color" content="#C25A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaydo" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#C25A2E" />
    <meta name="msapplication-config" content="none" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192x192.png" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />

    <!-- The Anton display font is self-hosted via @font-face in src/index.css,
         so there is no render-blocking external font stylesheet here. -->

    <!-- "/" is pre-rendered to the marketing landing page and is also the SPA
         fallback for every other path and the PWA's start_url, so whatever URL
         is loaded, that page paints for the moment before the app renders. On
         any other path it is simply the wrong page — a reload of /home flashed
         the marketing page — and on "/" with a stored session it makes a
         returning member look logged out. In both cases hide it behind the same
         cream the loading shell uses; the app uncovers the page once the real
         one has rendered (src/utils/prehydrationCover.js).
         The timeout is the failsafe for a bundle that never runs: without it a
         broken deploy would leave the visitor on a blank page. Once the bundle
         has started (src/main.jsx sets __KAYDO_BOOTED__) the app owns the cover
         and has its own valves, so a slow route chunk does not flash the
         landing page back in. -->
    <style>
      html.kaydo-restoring body { background: #FDF6EC; }
      html.kaydo-restoring #root { visibility: hidden; }
    </style>
    <script>
      (function () {
        var cover = location.pathname !== '/'
        if (!cover) {
          try {
            cover = !!(localStorage.getItem('fh_familyId') || sessionStorage.getItem('fh_familyId'))
          } catch (e) { /* storage blocked — show the page as normal */ }
        }
        if (!cover) return
        document.documentElement.classList.add('kaydo-restoring')
        setTimeout(function () {
          if (!window.__KAYDO_BOOTED__) document.documentElement.classList.remove('kaydo-restoring')
        }, 4000)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
