<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (global defaults; per-page title, description and canonical
         are injected by react-helmet-async on the pre-rendered pages) -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Kaydo" />
    <meta name="keywords" content="family memories, private photo sharing, encrypted family app, family journal, recipe keeper, digital scrapbook" />

    <!-- Open Graph / Social (shared across pages; og:title/description/url set per page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaydo" />
    <meta property="og:image" content="https://kaydo.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kaydo — Your Private Digital Home" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card (shared; title/description set per page) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kaydo.app/og-image.png" />
    <meta name="twitter:image:alt" content="Kaydo — Your Private Digital Home" />

    <!-- PWA / App -->
    <meta name="theme-color" content="#C25A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaydo" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#C25A2E" />
    <meta name="msapplication-config" content="none" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192x192.png" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />

    <!-- Google Fonts: Anton (scrapbook display type) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
